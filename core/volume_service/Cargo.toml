[package]
name = "volume_service"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
web = ["bridge_types/web", "volmath/web"]

[dependencies]
async-trait = "0.1"
bridge_types = { path = "../bridge_types" }
serde = { workspace = true }
nalgebra = { workspace = true }
volmath = { path = "../volmath" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
