[package]
name = "volmath"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Core neuroim dependency
neuroim = { workspace = true }

# Keep existing dependencies for compatibility layer
ts-rs = { version = "8.0", features = ["serde-compat"] }
serde = { version = "1.0", features = ["derive"] }
nalgebra = { version = "0.32", features = ["serde-serialize"] }
ndarray = "0.16"
bytemuck = "1.12"
num-traits = "0.2"
thiserror = "1.0"
once_cell = "1"
rayon = "1.5"
approx = "0.5"
wasm-bindgen = "0.2"
half = { version = "2.3", features = ["serde", "bytemuck"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# neuroim's rand dependency needs host entropy on browser/Node WASM targets.
# Keep this off native targets; do not substitute deterministic/random stubs.
getrandom = { version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
approx = "0.5"
wasm-bindgen-test = "0.3"
console_error_panic_hook = "0.1"

[features]
default = []
web = ["dep:getrandom"]
# parallel = ["rayon"]
# gpu = ["wgpu"] # Placeholder
