<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image set member picker, open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 376px; height: 620px; box-sizing: border-box; background: #222326; color: #e9eaec; border-left: 1px solid rgba(255,255,255,0.16); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; line-height: 18px; display: flex; flex-direction: column">

<section style="padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="height: 32px; display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 11px; line-height: 16px; font-weight: 500; color: #bdbfc4">Image set</h2>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; color: #a4a7ad">25 / 54</span>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<div style="display: flex; align-items: center; gap: 2px; flex-shrink: 0">
<button type="button" aria-label="Previous image" style="width: 24px; height: 24px; padding: 0; display: flex; align-items: center; justify-content: center; background: #1b1c1f; border: 1px solid rgba(255,255,255,0.28); border-radius: 2px"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#bdbfc4" stroke-width="1.4"><path d="M6.5 1.5L3 5l3.5 3.5"/></svg></button>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 0 6px">25 of 54</span>
<button type="button" aria-label="Next image" style="width: 24px; height: 24px; padding: 0; display: flex; align-items: center; justify-content: center; background: #1b1c1f; border: 1px solid rgba(255,255,255,0.28); border-radius: 2px"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#bdbfc4" stroke-width="1.4"><path d="M3.5 1.5L7 5 3.5 8.5"/></svg></button>
</div>
<button type="button" aria-label="Choose image" aria-expanded="true" style="flex-grow: 1; min-width: 0; height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 8px; background: #1b1c1f; color: #e9eaec; border: 1px solid rgba(255,255,255,0.38); border-radius: 2px; outline: 2px solid #d4a556; outline-offset: 1px; font: inherit; text-align: left">
<span style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Cue activity scaled by memory strength</span>
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#bdbfc4" stroke-width="1.4"><path d="M2 3.5L5 6.5l3-3"/></svg>
</button>
</div>
</section>

<div style="margin: -4px 12px 0 12px; background: #2a2b2f; border: 1px solid rgba(255,255,255,0.28); border-radius: 4px; box-shadow: 0 10px 32px rgba(0,0,0,0.32); display: flex; flex-direction: column; flex-grow: 1; min-height: 0; margin-bottom: 12px">

<div style="padding: 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.08)">
<label style="display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; background: #1b1c1f; border: 1px solid rgba(255,255,255,0.38); border-radius: 2px">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#bdbfc4" stroke-width="1.3"><circle cx="5" cy="5" r="3.5"/><path d="M7.8 7.8l2.7 2.7"/></svg>
<input type="text" aria-label="Find an image" value="cue_old" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #e9eaec; font: inherit; padding: 0">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #a4a7ad">12 of 54</span>
</label>
<div style="display: flex; align-items: center; gap: 6px">
<span style="font-size: 11px; line-height: 16px; color: #a4a7ad">Group by</span>
<div style="display: flex; border: 1px solid rgba(255,255,255,0.28); border-radius: 2px; overflow: hidden">
<button type="button" aria-pressed="true" style="height: 24px; padding: 0 8px; background: #d8dade; color: #151619; border: 0; font: inherit; font-size: 11px">Contrast</button>
<button type="button" aria-pressed="false" style="height: 24px; padding: 0 8px; background: #1b1c1f; color: #e9eaec; border: 0; border-left: 1px solid rgba(255,255,255,0.28); font: inherit; font-size: 11px">Kind</button>
<button type="button" aria-pressed="false" style="height: 24px; padding: 0 8px; background: #1b1c1f; color: #e9eaec; border: 0; border-left: 1px solid rgba(255,255,255,0.28); font: inherit; font-size: 11px">File order</button>
</div>
</div>
</div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 4px 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column">
<div style="padding: 6px 10px 2px 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 11px; line-height: 16px; font-weight: 500; color: #bdbfc4; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; color: #a4a7ad">{{g.key}}</span>
</div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="6">
<button type="button" style="{{r.style}}">
<span style="width: 44px; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px">{{r.kind}}</span>
<span style="flex-grow: 1; min-width: 0; color: #bdbfc4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.what}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #a4a7ad">{{r.n}}</span>
</button>
</sc-for>
</div>
</sc-for>
</div>

<div style="padding: 6px 10px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 8px; background: #222326; border-radius: 0 0 4px 4px">
<span style="flex-grow: 1; font-size: 11px; line-height: 16px; color: #a4a7ad">Type to find · Enter shows the image</span>
<button type="button" style="height: 24px; padding: 0 8px; background: #1b1c1f; color: #e9eaec; border: 1px solid rgba(255,255,255,0.28); border-radius: 2px; font: inherit">Edit members</button>
</div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":376,"height":620}}'>
class Component extends DCLogic {
renderVals() {
const base = 'height: 24px; width: 100%; box-sizing: border-box; padding: 0 10px 0 18px; display: flex; align-items: center; gap: 8px; border: 0; color: #e9eaec; font: inherit; text-align: left; ';
const row = (kind, what, n, sel) => ({ kind, what, n, style: base + (sel ? 'background: #36383d; box-shadow: inset 2px 0 0 #d4a556' : 'background: transparent') });
const kinds = (start, selKind) => [
row('t_g', 'Group t(23)', start, selKind === 't_g'),
row('tfce', 'TFCE of t(23)', start + 1, selKind === 'tfce'),
row('fwer', 'FWER-corrected p', start + 2, selKind === 'fwer'),
row('perm', 'Permutation p, uncorrected', start + 3, selKind === 'perm'),
row('beta_g', 'Group mean estimate', start + 4, selKind === 'beta_g'),
row('se_g', 'Standard error', start + 5, selKind === 'se_g')
];
return {
groups: [
{ label: 'Cue activity scaled by memory strength', key: 'mod_cue_old', rows: kinds(24, 'tfce') },
{ label: 'Old cue, excluding modulated trials', key: 'xold_cue_old', rows: kinds(48, null) }
]
};
}
}
</script>
</body>
</html>
