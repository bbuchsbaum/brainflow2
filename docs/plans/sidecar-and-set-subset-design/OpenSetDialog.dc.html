<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open image set dialog with subset selection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 640px; height: 720px; box-sizing: border-box; background: #2a2b2f; color: #e9eaec; border: 1px solid rgba(255,255,255,0.28); border-radius: 4px; box-shadow: 0 10px 32px rgba(0,0,0,0.32); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; line-height: 18px; display: flex; flex-direction: column">

<div style="padding: 20px 24px 14px 24px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.08)">
<h1 style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">Open folder as image set</h1>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; color: #a4a7ad; overflow-wrap: anywhere">/scratch/brad/dsets/pcmri/derivatives/…/group/obs · 54 images</span>
</div>

<div style="padding: 14px 24px 12px 24px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08)">

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 11px; line-height: 16px; font-weight: 500; color: #bdbfc4">Kind</span>
<span style="font-size: 11px; line-height: 16px; color: #a4a7ad">From the ends of the file names · 6 kinds × 9 contrasts, every image in one group</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="6">
<button type="button" aria-pressed="{{k.pressed}}" style="{{k.style}}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">{{k.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; opacity: 0.75">{{k.n}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<label style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; background: #1b1c1f; border: 1px solid rgba(255,255,255,0.38); border-radius: 2px">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#bdbfc4" stroke-width="1.3"><circle cx="5" cy="5" r="3.5"/><path d="M7.8 7.8l2.7 2.7"/></svg>
<input type="text" aria-label="Filter images by name" placeholder="Filter by name, for example cue -probe" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #e9eaec; font: inherit; padding: 0">
</label>
<button type="button" style="height: 24px; padding: 0 8px; background: #1b1c1f; color: #e9eaec; border: 1px solid rgba(255,255,255,0.28); border-radius: 2px; font: inherit">Select shown</button>
<button type="button" style="height: 24px; padding: 0 8px; background: #1b1c1f; color: #e9eaec; border: 1px solid rgba(255,255,255,0.28); border-radius: 2px; font: inherit">Clear shown</button>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1; font-size: 11px; line-height: 16px; color: #bdbfc4">Showing 9 of 54 · 9 selected, none hidden</span>
<label style="height: 24px; display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 16px; color: #bdbfc4">
<input type="checkbox" checked style="width: 12px; height: 12px; margin: 0; accent-color: #d8dade">
Show descriptions
</label>
</div>

</div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: #222326">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<label style="min-height: 44px; box-sizing: border-box; padding: 5px 24px; display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08)">
<input type="checkbox" checked style="width: 12px; height: 12px; margin: 3px 0 0 0; flex-shrink: 0; accent-color: #d8dade">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; color: #a4a7ad; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.file}}</span>
</span>
<span style="flex-shrink: 0; font-size: 11px; line-height: 18px; color: #bdbfc4">{{r.stat}}</span>
</label>
</sc-for>
</div>

<div style="padding: 12px 24px 16px 24px; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.16)">
<label style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px">
<span style="font-size: 11px; line-height: 16px; font-weight: 500; color: #bdbfc4; flex-shrink: 0">Set name</span>
<input type="text" value="obs · tfce" style="width: 200px; height: 24px; box-sizing: border-box; padding: 0 8px; background: #1b1c1f; color: #e9eaec; border: 1px solid rgba(255,255,255,0.38); border-radius: 2px; font: inherit">
</label>
<button type="button" style="height: 28px; padding: 0 12px; background: #1b1c1f; color: #e9eaec; border: 1px solid rgba(255,255,255,0.28); border-radius: 2px; font: inherit">Cancel</button>
<button type="button" style="height: 28px; padding: 0 12px; background: #d8dade; color: #151619; border: 1px solid #d8dade; border-radius: 2px; font: inherit; font-weight: 500">Open 9 images</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const chip = 'height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border-radius: 2px; font: inherit; ';
const on = chip + 'background: #d8dade; color: #151619; border: 1px solid #d8dade';
const off = chip + 'background: #1b1c1f; color: #e9eaec; border: 1px solid rgba(255,255,255,0.28)';
const kinds = [['t_g', 9, false], ['tfce', 9, true], ['fwer', 9, false], ['perm', 9, false], ['beta_g', 9, false], ['se_g', 9, false]];
const rows = [
['mod_cue_new', 'New cue activity scaled by memory strength'],
['mod_cue_old', 'Cue activity scaled by memory strength'],
['mod_probe_new', 'New probe activity scaled by memory strength'],
['mod_probe_old', 'Probe activity scaled by memory strength'],
['xnew_cue_new', 'contrast-xnew_cue_new_tfce.nii.gz'],
['xold_cue_old', 'Old cue, excluding modulated trials'],
['xold_probe_old', 'Old probe, excluding modulated trials'],
['old_gt_new_cue', 'Old greater than new, cue period'],
['old_gt_new_probe', 'contrast-old_gt_new_probe_tfce.nii.gz']
];
return {
kinds: kinds.map(([name, n, sel]) => ({ name, n, pressed: sel ? 'true' : 'false', style: sel ? on : off })),
rows: rows.map(([key, label]) => {
const file = 'contrast-' + key + '_tfce.nii.gz';
const has = label !== file;
return { label, file: has ? file : 'No sidecar', stat: has ? 'TFCE of t(23)' : 'tfce, from file name' };
})
};
}
}
</script>
</body>
</html>
