name: Runtime Shader Contract

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  shader-contract:
    name: Active masked shader contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Cargo dependencies
        env:
          CARGO_GIT_PAT: ${{ secrets.CARGO_GIT_PAT }}
        run: |
          git config --global url."https://${CARGO_GIT_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://${CARGO_GIT_PAT}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reflect active shaders against Rust layouts
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test -p render_loop --test shader_contract_test
