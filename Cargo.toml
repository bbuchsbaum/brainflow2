[workspace]
members = [
  "src-tauri",
  "core/render_loop",
  "core/render_contracts",
  "core/render_loop_benches",
  "core/filesystem",
  "core/loaders/nifti",
  "core/loaders/gifti",
  "core/volmath",
  "core/api_bridge",
  "core/bridge_types",
  "core/field_table",
  "core/atlases",
  "core/templates",
  "xtask", "core/colormap", "core/neuro-core", "core/neuro-cpu", "core/neuro-types", "core/neuro-integration-tests",
]
resolver = "2"

# Add workspace dependencies section
[workspace.dependencies]
tauri = { version = "^2.2", features = ["wry"] }
tauri-build = { version = "^2.2" }
tauri-plugin-opener = "^2.2"
tauri-plugin-log = "^2.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Graphics dependencies (Pinning to WGPU 0.20 stack for stability) ---
wgpu = "=0.20.1"
wgpu-core = "=0.20.1"
wgpu-hal = "=0.20.1"
wgpu-types = "=0.20.1"
naga = "=0.20.1"

# --- Pinned core dependencies for reproducible builds ---
nalgebra = "=0.32.6"
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
ts-rs = "=10.1.0"
anyhow = "=1.0.93"
tokio = { version = "=1.40.0", features = ["full"] }
thiserror = "=1.0.69"
futures = "=0.3.31"
# Additional pinned dependencies for security and stability
chrono = { version = "=0.4.38", features = ["serde"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
log = "=0.4.22"
env_logger = "=0.11.5"

# --- Atlas and Template dependencies ---
neuroatlas = { git = "https://github.com/bbuchsbaum/neuroatlas-rs", rev = "6384c6beac8808b53c2dd1dad4868bf161d1d280", features = ["surface"] }

# --- Surface and GIFTI support ---
neurosurf-rs = { git = "https://github.com/bbuchsbaum/neurosurf-rs", rev = "01155a5974e390f36949752f87098856f8d35c57", features = ["gifti-support"] }
gifti = { git = "https://github.com/bbuchsbaum/gifti-rs", rev = "00520ee8d00f8a223a440fd3c7381d63c4a36e75" }
neuroim = { git = "https://github.com/bbuchsbaum/neuroim-rs", rev = "e4495e30d782b856c0deb016520cd40075975dd4" }

# --- BIDS support ---
bids-rs = { git = "ssh://git@github.com/bbuchsbaum/bids-rs.git", branch = "main" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 'z'
panic = 'abort'

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 0

# Keep day-to-day `cargo tauri dev` responsive while making hot runtime paths
# (NIfTI decode + bridge orchestration + GPU upload/render) substantially faster.
[profile.dev.package.render_loop]
opt-level = 2

[profile.dev.package.api-bridge]
opt-level = 2

[profile.dev.package.nifti-loader]
opt-level = 2

[profile.dev.package.volmath]
opt-level = 2

# Atlas ROI palette generation is pure CPU number-crunching (slice-conflict graph
# + greedy color assignment over hundreds of ROIs). Unoptimized it takes ~8s; at
# opt-level 3 it drops to ~1s, so optimize it (and its centroid pass) even in dev.
[profile.dev.package.neuroatlas]
opt-level = 3

[profile.dev.package.atlases]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

# Mirror the hot-crate optimization into the test profile so palette smoke tests
# (and any atlas-heavy tests) run at realistic speed.
[profile.test.package.neuroatlas]
opt-level = 3

[profile.test.package.atlases]
opt-level = 3

[profile.test.package.ndarray]
opt-level = 3

# [patch.crates-io] section removed
