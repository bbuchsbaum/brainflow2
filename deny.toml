# cargo-deny configuration for Brainflow2 (cargo-deny 0.16+ "version 2" schema).
# Enforces security, licensing and source policies; run by
# scripts/validate-dependencies.sh in CI's Dependency Check job.

[graph]
all-features = false
no-default-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities, unmaintained and unsound crates are errors unless ignored
# below. Keep this list identical to .cargo/audit.toml, which explains each
# entry: only advisories with no fix we can take belong in either.
yanked = "warn"
ignore = [
    "RUSTSEC-2023-0071", # rsa: Marvin timing side channel, no fixed release
    "RUSTSEC-2024-0429", # glib: GTK3 bindings via Tauri (Linux)
    "RUSTSEC-2024-0370", # proc-macro-error: unmaintained (glib-macros, build time)
    "RUSTSEC-2025-0075", # unic-char-range: unmaintained (tauri -> urlpattern)
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0057", # fxhash: unmaintained, Tauri build scripts only
    "RUSTSEC-2026-0097", # rand 0.7: Tauri build scripts only
    "RUSTSEC-2024-0436", # paste: unmaintained proc macro (argmin), compile time
    "RUSTSEC-2025-0141", # bincode: unmaintained (neuroatlas-rs, templateflow-rs)
    "RUSTSEC-2026-0196", # cgmath: unmaintained (neurosurf-rs -> tri-mesh)
    "RUSTSEC-2026-0197", # cgmath: swap_columns unsound; nothing calls it
    "RUSTSEC-2026-0441", # pin-utils: unmaintained (futures-util, latest release)
    "RUSTSEC-2026-0370", # zvariant: merged into zbus 6 (Linux file dialog)
    "RUSTSEC-2026-0371", # zbus_names: merged into zbus 6
    "RUSTSEC-2026-0372", # zvariant_derive: merged into zbus 6
]

[licenses]
version = 2
confidence-threshold = 0.8
# Only these licenses are accepted; anything else (GPL, AGPL, LGPL, EUPL,
# CeCILL and other copyleft licenses included) is an error.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",      # successor to Unicode-DFS-2016 (icu_*, unicode-ident)
    "BSL-1.0",          # Boost, permissive (clipboard-win via arboard)
    "bzip2-1.0.6",      # permissive (libbz2-rs-sys)
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    "Unlicense",
]
exceptions = []
# This workspace's own crates are marked `publish = false` and carry no
# license field; they are not checked.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # OpenSSL only as native-tls's Linux backend: reqwest's default TLS, used
    # by neuroatlas-rs and templateflow-rs. Switching those to reqwest's
    # rustls feature would remove it.
    { name = "openssl", wrappers = ["native-tls"] },
    # Unmaintained; allowed only inside the GTK3 macros Tauri needs on Linux.
    { name = "proc-macro-error", wrappers = ["glib-macros", "gtk3-macros"] },
    { name = "stdweb" },           # Deprecated in favor of web-sys
    { name = "failure" },          # Deprecated in favor of thiserror/anyhow
]
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/tauri-apps/tauri",
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/dimforge/nalgebra",
    "https://github.com/bbuchsbaum/neuroatlas-rs",
]
